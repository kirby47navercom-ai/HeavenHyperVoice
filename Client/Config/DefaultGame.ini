; 코드가 경로 문자열로만 읽는 폴더는 쿠커가 참조를 볼 수 없다. 에디터는
; 디스크에서 바로 읽으니 잘 되고, 패키징하면 통째로 빠져 조용히 실패한다.
;
; /Game/Gacha 는 전용 맵과 그 안의 BP 끼리만 서로 참조하는 섬이라 필드 맵에서
; 닿지 않는다. 기계와 화면을 UEGachaDesk 가 경로 문자열로 읽으므로 패키지에
; 안 들어갔고, O 를 눌러도 아무 일이 없었다.
; /Game/UI/PokemonType 은 T_Type_<속성 이름> 규칙으로 만들어 읽어서 참조가 아예 없다.
