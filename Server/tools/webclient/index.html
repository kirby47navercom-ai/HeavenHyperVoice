<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>울려라! 천계의 하이퍼 보이스</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1017;
    --panel: #161a22;
    --line: #2a3040;
    --ink: #e8eaf0;
    --dim: #79839a;
    --gold: #f2c14e;
    --red: #d4453d;
    --blue: #4a90d9;
    --green: #5fc98a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.6 "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1a2030 0%, var(--bg) 65%);
    color: var(--ink);
    overflow: hidden;
  }

  .screen { display: none; height: 100%; }
  .screen.active { display: flex; }

  /* ------------------------------------------------------------- 타이틀 */

  #title {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  #title .brand {
    font-size: clamp(28px, 6vw, 60px);
    font-weight: 800;
    letter-spacing: .22em;
    color: var(--gold);
    text-shadow: 0 0 28px rgba(242, 193, 78, .35);
    margin-bottom: 18px;
  }
  #title .main {
    font-size: clamp(20px, 3.6vw, 38px);
    font-weight: 700;
    letter-spacing: .06em;
    text-align: center;
    line-height: 1.35;
  }
  #title .main .bang { color: var(--red); }
  #title .rule {
    width: min(560px, 76vw);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
    margin: 30px 0;
  }
  #title .prompt {
    font-size: 14px;
    letter-spacing: .3em;
    color: var(--dim);
    animation: blink 1.4s steps(1, end) infinite;
  }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .15; } }

  /* --------------------------------------------------------- 폼 화면 공용 */

  .form-screen { align-items: center; justify-content: center; }
  .card {
    width: min(400px, 88vw);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 26px 22px;
  }
  .card h2 {
    margin: 0 0 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .18em;
    color: var(--dim);
  }
  label { display: block; margin-bottom: 13px; }
  label span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  input {
    width: 100%;
    background: #0f131a;
    color: inherit;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 9px 11px;
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--blue); }
  button {
    background: #232937;
    color: var(--ink);
    border: 1px solid #38405370;
    border-radius: 5px;
    padding: 9px 16px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2d3547; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #08111c; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #5c9ee0; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); padding-left: 0; }
  button.ghost:hover { color: var(--ink); background: none; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .actions .primary { flex: 1; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; }
  .msg.bad { color: var(--red); }
  .msg.good { color: var(--green); }

  /* 우측 하단 회원가입 진입 */
  .corner {
    position: fixed;
    bottom: 22px;
    right: 24px;
    font-size: 13px;
    color: var(--dim);
  }
  .corner button { padding: 7px 14px; }

  /* --------------------------------------------------------------- 채팅 */

  #chat { flex-direction: column; padding: 20px 22px 0; }
  #chat header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  #chat header .who { font-weight: 700; color: var(--gold); }
  #chat header .where { color: var(--dim); font-size: 12px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 2px;
    font-family: Consolas, "D2Coding", monospace;
    font-size: 14px;
  }
  #log div { margin-bottom: 4px; word-break: break-word; }
  #log .notice { color: var(--gold); }
  #log .closed { color: var(--red); }
  #log .system { color: var(--dim); }
  #log .me strong { color: var(--green); }
  #log strong { color: var(--blue); font-weight: 600; }
  #sayForm { display: flex; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  #sayForm input { flex: 1; }
  #chat footer {
    display: flex;
    gap: 8px;
    padding: 0 0 18px;
  }
  #chat footer button { padding: 7px 14px; font-size: 13px; }

  /* --------------------------------------------------------- 회원 정보 */

  #info {
    position: fixed;
    inset: 0;
    background: #05070bcc;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #info.open { display: flex; }
  #info .card { width: min(360px, 88vw); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 14px; }
  dt { color: var(--dim); }
  dd { margin: 0; text-align: right; word-break: break-all; }
</style>
</head>
<body>

<!-- ------------------------------------------------------------- 타이틀 -->
<section class="screen active" id="title">
  <div class="brand">포켓몬스터</div>
  <div class="main">울려라<span class="bang">!</span><br>천계의 하이퍼 보이스</div>
  <div class="rule"></div>
  <div class="prompt">PRESS ENTER</div>
</section>

<!-- ------------------------------------------------------------- 로그인 -->
<section class="screen form-screen" id="login">
  <div class="card">
    <h2>로그인</h2>
    <label><span>아이디</span><input id="loginUser" autocomplete="off"></label>
    <label><span>비밀번호</span><input id="loginPw" type="password"></label>
    <div class="actions">
      <button class="primary" id="loginBtn">접속</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>
  <div class="corner">
    <button id="toRegister">회원가입</button>
  </div>
</section>

<!-- ----------------------------------------------------------- 회원가입 -->
<section class="screen form-screen" id="register">
  <div class="card">
    <h2>회원가입</h2>
    <label><span>아이디 &mdash; 영문·숫자·밑줄 3~32자</span><input id="regUser" autocomplete="off"></label>
    <label><span>비밀번호 &mdash; 8자 이상</span><input id="regPw" type="password"></label>
    <label><span>닉네임 &mdash; 2~32자</span><input id="regNick" autocomplete="off"></label>
    <div class="actions">
      <button class="primary" id="registerBtn">가입</button>
      <button id="toLogin">돌아가기</button>
    </div>
    <div class="msg" id="regMsg"></div>
  </div>
</section>

<!-- --------------------------------------------------------------- 채팅 -->
<section class="screen" id="chat">
  <header>
    <span class="who" id="chatWho"></span>
    <span class="where" id="chatWhere"></span>
  </header>
  <div id="log"></div>
  <form id="sayForm">
    <input id="text" placeholder="메시지" autocomplete="off">
    <button class="primary" id="sayBtn">보내기</button>
  </form>
  <footer>
    <button id="infoBtn">회원 정보</button>
    <button id="logoutBtn">로그아웃</button>
  </footer>
</section>

<!-- ----------------------------------------------------------- 정보 창 -->
<div id="info">
  <div class="card">
    <h2>회원 정보</h2>
    <dl>
      <dt>닉네임</dt><dd id="infoNick"></dd>
      <dt>아이디</dt><dd id="infoUser"></dd>
      <dt>채팅 서버</dt><dd id="infoChat"></dd>
      <dt>인증 티켓</dt><dd id="infoTicket"></dd>
      <dt>접속 시각</dt><dd id="infoSince"></dd>
    </dl>
    <div class="actions"><button class="primary" id="infoClose">닫기</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const escape = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let account = null;   // {username, nickname, chat, ticketBytes, since}

function show(name) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('active', s.id === name);
  const focus = { login: 'loginUser', register: 'regUser', chat: 'text' }[name];
  if (focus) $(focus).focus();
}

function append(cls, html) {
  const line = document.createElement('div');
  line.className = cls;
  line.innerHTML = html;
  $('log').appendChild(line);
  $('log').scrollTop = $('log').scrollHeight;
}

function say(el, text, ok) {
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'good' : 'bad');
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

// --------------------------------------------------------------- 타이틀

function leaveTitle() {
  if ($('title').classList.contains('active')) show('login');
}
$('title').onclick = leaveTitle;
addEventListener('keydown', e => {
  if (e.key === 'Enter') leaveTitle();
  if (e.key === 'Escape' && $('info').classList.contains('open')) $('info').classList.remove('open');
});

// --------------------------------------------------------------- 로그인

$('toRegister').onclick = () => show('register');
$('toLogin').onclick = () => show('login');

async function doLogin() {
  const username = $('loginUser').value.trim();
  $('loginBtn').disabled = true;
  say($('loginMsg'), '접속 중…', true);
  try {
    const r = await post('/api/login', { username, password: $('loginPw').value });
    if (!r.ok) return say($('loginMsg'), r.message || '로그인 실패', false);

    account = { username, nickname: r.nickname, chat: r.chat,
                ticketBytes: r.ticketBytes, since: new Date().toLocaleTimeString('ko-KR') };
    $('loginPw').value = '';
    say($('loginMsg'), '', true);
    $('log').innerHTML = '';
    $('chatWho').textContent = r.nickname;
    $('chatWhere').textContent = r.chat;
    append('system', `로그인 성공 — 티켓 ${r.ticketBytes}바이트`);
    show('chat');
  } finally {
    $('loginBtn').disabled = false;
  }
}
$('loginBtn').onclick = doLogin;
for (const id of ['loginUser', 'loginPw']) {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

// ------------------------------------------------------------- 회원가입

async function doRegister() {
  $('registerBtn').disabled = true;
  say($('regMsg'), '처리 중…', true);
  try {
    const r = await post('/api/register', {
      username: $('regUser').value.trim(),
      password: $('regPw').value,
      nickname: $('regNick').value.trim(),
    });
    say($('regMsg'), r.message || (r.ok ? '가입 완료' : '가입 실패'), r.ok);
    if (r.ok) {
      $('loginUser').value = $('regUser').value.trim();
      setTimeout(() => show('login'), 900);
    }
  } finally {
    $('registerBtn').disabled = false;
  }
}
$('registerBtn').onclick = doRegister;
for (const id of ['regUser', 'regPw', 'regNick']) {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
}

// ----------------------------------------------------------------- 채팅

$('sayForm').onsubmit = async e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  const r = await post('/api/say', { text });
  if (!r.ok) append('closed', escape(r.message || '전송 실패'));
};

$('logoutBtn').onclick = async () => {
  await post('/api/logout', {});
  account = null;
  say($('loginMsg'), '로그아웃했습니다', true);
  show('login');
};

// ------------------------------------------------------------- 회원 정보

$('infoBtn').onclick = () => {
  if (!account) return;
  $('infoNick').textContent = account.nickname;
  $('infoUser').textContent = account.username;
  $('infoChat').textContent = account.chat;
  $('infoTicket').textContent = `${account.ticketBytes}바이트 (Ed25519 서명)`;
  $('infoSince').textContent = account.since;
  $('info').classList.add('open');
};
$('infoClose').onclick = () => $('info').classList.remove('open');
$('info').onclick = e => { if (e.target === $('info')) $('info').classList.remove('open'); };

// 서버가 밀어주는 이벤트. 브리지가 채팅 소켓을 대신 읽는다.
new EventSource('/api/events').onmessage = e => {
  const ev = JSON.parse(e.data);
  if (ev.kind === 'chat') {
    append(account && ev.nickname === account.nickname ? 'me' : '',
           `<strong>${escape(ev.nickname)}</strong> ${escape(ev.text)}`);
  } else if (ev.kind === 'notice') {
    append('notice', `* ${escape(ev.text)}`);
  } else if (ev.kind === 'closed') {
    append('closed', `연결 종료: ${escape(ev.text)}`);
    account = null;
    say($('loginMsg'), '연결이 종료되었습니다', false);
    show('login');
  }
};
</script>
</body>
</html>
