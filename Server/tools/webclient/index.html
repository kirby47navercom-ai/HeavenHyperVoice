<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>울려라! 천계의 하이퍼 보이스</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1017;
    --panel: #161a22;
    --line: #2a3040;
    --ink: #e8eaf0;
    --dim: #79839a;
    --gold: #f2c14e;
    --red: #d4453d;
    --blue: #4a90d9;
    --green: #5fc98a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.6 "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1a2030 0%, var(--bg) 65%);
    color: var(--ink);
    overflow: hidden;
  }

  .screen { display: none; height: 100%; }
  .screen.active { display: flex; }

  /* ------------------------------------------------------------- 타이틀 */

  #title {
    flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
  }
  #title .brand {
    font-size: clamp(28px, 6vw, 60px); font-weight: 800; letter-spacing: .22em;
    color: var(--gold); text-shadow: 0 0 28px rgba(242, 193, 78, .35); margin-bottom: 18px;
  }
  #title .main {
    font-size: clamp(20px, 3.6vw, 38px); font-weight: 700; letter-spacing: .06em;
    text-align: center; line-height: 1.35;
  }
  #title .main .bang { color: var(--red); }
  #title .rule {
    width: min(560px, 76vw); height: 1px; margin: 30px 0;
    background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
  }
  #title .prompt {
    font-size: 14px; letter-spacing: .3em; color: var(--dim);
    animation: blink 1.4s steps(1, end) infinite;
  }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .15; } }

  /* --------------------------------------------------------- 폼 화면 공용 */

  .form-screen { align-items: center; justify-content: center; }
  .card {
    width: min(400px, 88vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 26px 26px 22px;
  }
  .card h2 {
    margin: 0 0 20px; font-size: 13px; font-weight: 600; letter-spacing: .18em; color: var(--dim);
  }
  label { display: block; margin-bottom: 13px; }
  label span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  input {
    width: 100%; background: #0f131a; color: inherit; border: 1px solid var(--line);
    border-radius: 5px; padding: 9px 11px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--blue); }
  button {
    background: #232937; color: var(--ink); border: 1px solid #38405370;
    border-radius: 5px; padding: 9px 16px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2d3547; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #08111c; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #5c9ee0; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .actions .primary { flex: 1; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; }
  .msg.bad { color: var(--red); }
  .msg.good { color: var(--green); }

  .corner { position: fixed; bottom: 22px; right: 24px; font-size: 13px; color: var(--dim); }
  .corner button { padding: 7px 14px; }
  .corner-left { position: fixed; bottom: 22px; left: 24px; display: flex; gap: 8px; }
  .corner-left button { padding: 7px 14px; font-size: 13px; }

  /* ----------------------------------------------------------------- 로비 */

  #characters { flex-direction: column; align-items: center; justify-content: center; }
  #characters h2 {
    font-size: 13px; font-weight: 600; letter-spacing: .18em; color: var(--dim);
    margin: 0 0 4px;
  }
  #lobbyWho { font-size: 12px; color: var(--dim); margin-bottom: 22px; }
  #lobbyWho b { color: var(--gold); }

  /* 슬롯 수는 고정이다. 비어 있어도 자리를 차지해야 "세 자리 중 하나" 라는 게 보인다. */
  .slots { display: grid; grid-auto-flow: column; gap: 16px; }
  .slot {
    width: 232px; height: 330px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px; display: flex; flex-direction: column;
    position: relative; transition: border-color .12s, transform .12s;
  }
  .slot.filled:hover { border-color: var(--blue); transform: translateY(-2px); }
  .slot .index {
    position: absolute; top: 12px; right: 14px;
    font-size: 11px; letter-spacing: .12em; color: #39415280;
  }
  .slot.empty {
    align-items: center; justify-content: center; border-style: dashed; color: var(--dim);
    cursor: pointer; gap: 6px;
  }
  .slot.empty:hover { border-color: var(--blue); color: var(--ink); transform: translateY(-2px); }
  .slot.locked { border-style: dashed; opacity: .35; cursor: default; }
  .slot.locked:hover { transform: none; border-color: var(--line); }

  .slot .who { font-size: 18px; font-weight: 700; color: var(--gold); }
  .slot .lv { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .slot .partner { font-size: 13px; }
  .slot .partner b { color: var(--green); }
  .stats {
    display: grid; grid-template-columns: 1fr auto; gap: 1px 10px;
    font-size: 12px; color: var(--dim); margin-top: 8px;
  }
  .stats b { color: var(--ink); font-weight: 600; text-align: right; }
  .slot-actions { margin-top: auto; display: flex; gap: 6px; }
  .slot-actions .primary { flex: 1; }
  .slot-actions .danger {
    padding: 9px 10px; font-size: 12px; color: var(--red); border-color: #4a2a2a;
  }
  .slot-actions .danger:hover { background: #33201f; }
  .slot .none {
    font-size: 12px; color: var(--dim); margin-top: 2px;
    padding: 10px; border: 1px dashed var(--line); border-radius: 6px; text-align: center;
  }

  /* 스타터 선택 */
  #starters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  #starters button {
    padding: 9px 4px; font-size: 12px; line-height: 1.3; text-align: center; border-radius: 6px;
  }
  #starters button.picked { border-color: var(--gold); background: #2e2a1c; color: var(--gold); }
  #starterInfo { font-size: 12px; color: var(--dim); min-height: 34px; margin-bottom: 10px; }

  /* --------------------------------------------------------------- 필드 */

  #field { padding: 0; }
  #canvas { display: block; width: 100%; height: 100%; background: #0a0d13; }

  #hud {
    position: fixed; top: 18px; left: 22px;
    display: flex; gap: 14px; align-items: baseline;
    font-size: 12px; color: var(--dim);
    background: #0d1017b0; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
  }
  #hud b { font-size: 15px; color: var(--gold); }

  /* 좌측 하단 채팅. 필드를 가리지 않게 반투명하고 좀다. */
  #chatbox {
    position: fixed; bottom: 22px; left: 22px; width: min(380px, 40vw);
    background: #0d1017c8; border: 1px solid var(--line); border-radius: 8px;
    display: flex; flex-direction: column;
  }
  #log {
    height: 170px; overflow-y: auto; padding: 10px 12px;
    font-family: Consolas, "D2Coding", monospace; font-size: 13px;
  }
  #log div { margin-bottom: 3px; word-break: break-word; }
  #log .notice { color: var(--gold); }
  #log .closed { color: var(--red); }
  #log .system { color: var(--dim); }
  #log .me strong { color: var(--green); }
  #log strong { color: var(--blue); font-weight: 600; }
  #sayForm { border-top: 1px solid var(--line); padding: 8px; }
  #sayForm input { background: #0f131a80; }

  /* --------------------------------------------------------- 회원 정보 */

  #info {
    position: fixed; inset: 0; background: #05070bcc;
    display: none; align-items: center; justify-content: center;
  }
  #info.open { display: flex; }
  #info .card { width: min(360px, 88vw); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; font-size: 14px; }
  dt { color: var(--dim); }
  dd { margin: 0; text-align: right; word-break: break-all; }
</style>
</head>
<body>

<!-- ------------------------------------------------------------- 타이틀 -->
<section class="screen active" id="title">
  <div class="brand">포켓몬스터</div>
  <div class="main">울려라<span class="bang">!</span><br>천계의 하이퍼 보이스</div>
  <div class="rule"></div>
  <div class="prompt">PRESS ENTER</div>
</section>

<!-- ------------------------------------------------------------- 로그인 -->
<section class="screen form-screen" id="login">
  <div class="card">
    <h2>로그인</h2>
    <label><span>아이디</span><input id="loginUser" autocomplete="off"></label>
    <label><span>비밀번호</span><input id="loginPw" type="password"></label>
    <div class="actions"><button class="primary" id="loginBtn">접속</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>
  <div class="corner"><button id="toRegister">회원가입</button></div>
</section>

<!-- ----------------------------------------------------------- 회원가입 -->
<section class="screen form-screen" id="register">
  <div class="card">
    <h2>회원가입</h2>
    <label><span>아이디 &mdash; 영문·숫자·밑줄 3~32자</span><input id="regUser" autocomplete="off"></label>
    <label><span>비밀번호 &mdash; 8자 이상</span><input id="regPw" type="password"></label>
    <div class="actions">
      <button class="primary" id="registerBtn">가입</button>
      <button id="toLogin">돌아가기</button>
    </div>
    <div class="msg" id="regMsg"></div>
  </div>
</section>

<!-- ------------------------------------------------------- 캐릭터 선택 -->
<section class="screen" id="characters">
  <h2>로비</h2>
  <div id="lobbyWho"></div>
  <div class="slots" id="slots"></div>
  <div class="msg" id="charMsg" style="text-align:center"></div>
  <div class="corner-left"><button id="charLogout">로그아웃</button></div>
</section>

<!-- ------------------------------------------------------- 캐릭터 생성 -->
<section class="screen form-screen" id="create">
  <div class="card">
    <h2>새 캐릭터</h2>
    <label><span>닉네임 &mdash; 2~32자</span><input id="createNick" autocomplete="off"></label>
    <span style="display:block;font-size:12px;color:var(--dim);margin-bottom:6px">파트너</span>
    <div id="starters"></div>
    <div id="starterInfo"></div>
    <div class="actions">
      <button class="primary" id="createBtn">만들기</button>
      <button id="createCancel">취소</button>
    </div>
    <div class="msg" id="createMsg"></div>
  </div>
</section>

<!-- --------------------------------------------------------------- 필드 -->
<section class="screen" id="field">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <b id="hudWho"></b>
    <span id="hudPos"></span>
    <span id="hudNear"></span>
  </div>

  <div id="chatbox">
    <div id="log"></div>
    <form id="sayForm">
      <input id="text" placeholder="메시지 (Enter)" autocomplete="off">
    </form>
  </div>

  <div class="corner" style="display:flex; gap:8px">
    <button id="infoBtn">회원 정보</button>
    <button id="leaveBtn">캐릭터 선택</button>
    <button id="logoutBtn">로그아웃</button>
  </div>
</section>

<!-- ----------------------------------------------------------- 정보 창 -->
<div id="info">
  <div class="card">
    <h2>회원 정보</h2>
    <dl>
      <dt>아이디</dt><dd id="infoUser"></dd>
      <dt>캐릭터</dt><dd id="infoNick"></dd>
      <dt>파트너</dt><dd id="infoPartner"></dd>
      <dt>접속 서버</dt><dd id="infoChat"></dd>
      <dt>인증 티켓</dt><dd id="infoTicket"></dd>
      <dt>접속 시각</dt><dd id="infoSince"></dd>
    </dl>
    <div class="actions"><button class="primary" id="infoClose">닫기</button></div>
  </div>
</div>

<script>
// 종족 데이터는 클라이언트에 둔다. 바뀌지 않는 게임 데이터이고, 실제
// Unreal 클라이언트도 모델과 이름을 자기가 들고 있어야 한다. 서버는 id 만
// 검증하고 실제 스탯을 계산해 내려준다 (Protocol/PokemonSpecies.h).
const SPECIES = [
  { id: 1,  name: '이상해씨',   base: [45, 49, 49, 65, 65, 45] },
  { id: 2,  name: '파이리',     base: [39, 52, 43, 60, 50, 65] },
  { id: 3,  name: '꼬부기',     base: [44, 48, 65, 50, 64, 43] },
  { id: 4,  name: '피카츄',     base: [35, 55, 40, 50, 50, 90] },
  { id: 5,  name: '이브이',     base: [55, 55, 50, 45, 65, 55] },
  { id: 6,  name: '구구',       base: [40, 45, 40, 35, 35, 56] },
  { id: 7,  name: '꼬렛',       base: [30, 56, 35, 25, 35, 72] },
  { id: 8,  name: '모래두지',   base: [50, 75, 85, 20, 30, 40] },
  { id: 9,  name: '나옹',       base: [40, 45, 35, 40, 40, 90] },
  { id: 10, name: '고라파덕',   base: [50, 52, 48, 65, 50, 55] },
];
const speciesName = id => (SPECIES.find(s => s.id === id) || {}).name || `#${id}`;
const STAT_LABELS = ['체력', '공격', '방어', '특수공격', '특수방어', '스피드'];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let username = '';
let characters = [];
let maxSlots = 3;
let session = null;   // {nickname, partner, chat, ticketBytes, since}
let pickedSpecies = 0;   // 0 = 파트너 없이 시작

function show(name) {
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('active', s.id === name);
  // 필드에서는 입력창에 포커스를 주지 않는다. WASD 가 채팅으로 들어간다.
  const focus = { login: 'loginUser', register: 'regUser', create: 'createNick' }[name];
  if (focus) $(focus).focus();
}

function say(el, text, ok) {
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'good' : 'bad');
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  return r.json();
}

// --------------------------------------------------------------- 타이틀

function leaveTitle() {
  if ($('title').classList.contains('active')) show('login');
}
$('title').onclick = leaveTitle;
addEventListener('keydown', e => {
  if (e.key === 'Enter') leaveTitle();
  if (e.key === 'Escape' && $('info').classList.contains('open')) $('info').classList.remove('open');
});

// --------------------------------------------------------------- 로그인

$('toRegister').onclick = () => show('register');
$('toLogin').onclick = () => show('login');

async function doLogin() {
  $('loginBtn').disabled = true;
  say($('loginMsg'), '접속 중…', true);
  try {
    const user = $('loginUser').value.trim();
    const r = await post('/api/login', { username: user, password: $('loginPw').value });
    if (!r.ok) return say($('loginMsg'), r.message || '로그인 실패', false);

    username = user;
    maxSlots = r.maxSlots || 3;
    characters = r.characters || [];
    $('loginPw').value = '';
    say($('loginMsg'), '', true);
    renderSlots();
    show('characters');
  } finally {
    $('loginBtn').disabled = false;
  }
}
$('loginBtn').onclick = doLogin;
for (const id of ['loginUser', 'loginPw']) {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}

// ------------------------------------------------------------- 회원가입

async function doRegister() {
  $('registerBtn').disabled = true;
  say($('regMsg'), '처리 중…', true);
  try {
    const r = await post('/api/register', {
      username: $('regUser').value.trim(), password: $('regPw').value,
    });
    say($('regMsg'), r.message || (r.ok ? '가입 완료' : '가입 실패'), r.ok);
    if (r.ok) {
      $('loginUser').value = $('regUser').value.trim();
      setTimeout(() => show('login'), 1200);
    }
  } finally {
    $('registerBtn').disabled = false;
  }
}
$('registerBtn').onclick = doRegister;
for (const id of ['regUser', 'regPw']) {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
}

// --------------------------------------------------------- 캐릭터 선택

function statRows(partner) {
  const values = [partner.maxHp, partner.atk, partner.def,
                  partner.spAtk, partner.spDef, partner.speed];
  return STAT_LABELS.map((label, i) => `<span>${label}</span><b>${values[i]}</b>`).join('');
}

function openCreate() {
  $('createNick').value = '';
  pickedSpecies = 0;   // 파트너 없이 시작하는 것이 기본이다
  say($('createMsg'), '', true);
  renderStarters();
  show('create');
}

// 슬롯은 항상 maxSlots 개를 그린다. 빈 자리가 보여야 몇 개까지 만들 수 있는지
// 알 수 있고, 캐릭터가 늘어도 카드가 자리를 옮기지 않는다.
function renderSlots() {
  $('lobbyWho').innerHTML = `<b>${esc(username)}</b> — 캐릭터 ${characters.length} / ${maxSlots}`;

  const slots = $('slots');
  slots.innerHTML = '';

  for (let i = 0; i < maxSlots; i++) {
    const character = characters[i];
    const card = document.createElement('div');
    card.innerHTML = `<div class="index">SLOT ${i + 1}</div>`;

    if (character) {
      card.className = 'slot filled';
      const partner = character.partner;
      card.insertAdjacentHTML('beforeend',
        `<div class="who">${esc(character.nickname)}</div>` +
        `<div class="lv">Lv.${character.level}</div>` +
        (partner
          ? `<div class="partner">파트너 <b>${esc(partner.nickname || speciesName(partner.speciesId))}</b>` +
            ` <span style="color:var(--dim)">Lv.${partner.level}</span></div>` +
            `<div class="stats">${statRows(partner)}</div>`
          : `<div class="none">파트너 없음<br>필드에서 만나게 됩니다</div>`));

      const actions = document.createElement('div');
      actions.className = 'slot-actions';

      const enter = document.createElement('button');
      enter.className = 'primary';
      enter.textContent = '입장';
      enter.onclick = () => enterField(character.id);
      actions.appendChild(enter);

      if (partner) {
        const release = document.createElement('button');
        release.className = 'danger';
        release.title = '파트너를 놓아줍니다';
        release.textContent = '방생';
        release.onclick = () => releasePartner(character);
        actions.appendChild(release);
      }

      const remove = document.createElement('button');
      remove.className = 'danger';
      remove.textContent = '삭제';
      remove.onclick = () => deleteCharacter(character);
      actions.appendChild(remove);

      card.appendChild(actions);
    } else if (i === characters.length) {
      // 다음 빈 자리 하나만 누를 수 있다. 그 뒤는 잠긴 것으로 보여준다.
      card.className = 'slot empty';
      card.insertAdjacentHTML('beforeend',
        `<div style="font-size:34px;line-height:1">+</div><div>새 캐릭터</div>`);
      card.onclick = openCreate;
    } else {
      card.className = 'slot empty locked';
      card.insertAdjacentHTML('beforeend', `<div>비어 있음</div>`);
    }

    slots.appendChild(card);
  }
}

async function enterField(characterId) {
  say($('charMsg'), '입장 중…', true);

  // 응답을 받기 전에 비운다. 브리지는 HTTP 응답을 돌려주기 전에 필드에
  // 접속하므로, Spawn 이 WebSocket 으로 먼저 도착한다. 응답 뒤에 비우면
  // 방금 받은 Spawn 을 지운다.
  $('log').innerHTML = '';
  entities.clear();

  const r = await post('/api/characters/select', { characterId });
  if (!r.ok) {
    say($('charMsg'), r.message || '입장 실패', false);
    return;
  }

  const character = characters.find(c => c.id === characterId);
  session = {
    nickname: r.nickname,
    partner: character && character.partner,
    services: r.services,
    since: new Date().toLocaleTimeString('ko-KR'),
  };
  say($('charMsg'), '', true);
  $('hudWho').textContent = r.nickname;
  append('system', Object.keys(r.services || {}).map(k => k + ' ' + r.services[k]).join(' · '));
  show('field');
  resize();
}

// 삭제는 되돌릴 수 없다. 닉네임을 다시 입력받아 서버로 보내고, 서버가
// 실제 닉네임과 대조한다. 잘못 누른 한 번으로 다른 캐릭터가 지워지지 않는다.
async function deleteCharacter(character) {
  const typed = prompt(
    `"${character.nickname}" 을(를) 삭제합니다. 되돌릴 수 없습니다.\n` +
    `닉네임은 계속 점유되어 다시 만들 수 없습니다.\n\n확인하려면 닉네임을 입력하세요:`);
  if (typed === null) return;

  const r = await post('/api/characters/delete',
                       { characterId: character.id, confirm: typed });
  if (r.characters) { characters = r.characters; renderSlots(); }
  say($('charMsg'), r.message || (r.ok ? '삭제했습니다' : '삭제하지 못했습니다'), r.ok);
}

async function releasePartner(character) {
  const name = character.partner.nickname || speciesName(character.partner.speciesId);
  if (!confirm(`${character.nickname} 의 파트너 ${name} 을(를) 놓아줍니다.\n되돌릴 수 없습니다.`)) {
    return;
  }
  const r = await post('/api/characters/release', { characterId: character.id });
  if (r.characters) { characters = r.characters; renderSlots(); }
  say($('charMsg'), r.message || (r.ok ? '놓아주었습니다' : '실패했습니다'), r.ok);
}

$('charLogout').onclick = async () => {
  await post('/api/logout');
  username = ''; characters = []; session = null;
  say($('loginMsg'), '로그아웃했습니다', true);
  show('login');
};

// --------------------------------------------------------- 캐릭터 생성

function renderStarters() {
  const box = $('starters');
  box.innerHTML = '';

  // 0 번은 "없이 시작". 파트너 없는 캐릭터도 정상 상태다.
  for (const species of [{ id: 0, name: '없이 시작' }].concat(SPECIES)) {
    const button = document.createElement('button');
    button.textContent = species.name;
    button.className = species.id === pickedSpecies ? 'picked' : '';
    button.onclick = () => { pickedSpecies = species.id; renderStarters(); };
    box.appendChild(button);
  }

  const picked = SPECIES.find(s => s.id === pickedSpecies);
  $('starterInfo').innerHTML = picked
    ? `<b style="color:var(--gold)">${esc(picked.name)}</b> 종족값 — ` +
      STAT_LABELS.map((label, i) => `${label} ${picked.base[i]}`).join(', ') +
      `<br>레벨 5로 시작합니다. 실제 스탯은 서버가 계산합니다.`
    : `파트너 없이 시작합니다. 나중에 필드에서 만나면 됩니다.`;
}

$('createCancel').onclick = () => show('characters');

async function doCreate() {
  $('createBtn').disabled = true;
  say($('createMsg'), '만드는 중…', true);
  try {
    const r = await post('/api/characters/create', {
      nickname: $('createNick').value.trim(), speciesId: pickedSpecies,
    });
    if (r.characters) { characters = r.characters; renderSlots(); }
    if (!r.ok) return say($('createMsg'), r.message || '만들지 못했습니다', false);
    say($('charMsg'), r.message || '캐릭터를 만들었습니다', true);
    show('characters');
  } finally {
    $('createBtn').disabled = false;
  }
}
$('createBtn').onclick = doCreate;
$('createNick').addEventListener('keydown', e => { if (e.key === 'Enter') doCreate(); });

// ----------------------------------------------------------------- 필드
//
// 서버는 20Hz 로 스냅샷을 보낸다. 그대로 그리면 뚝뚝 끊기므로 목표 좌표로
// 보간한다. 내 캐릭터만은 입력 즉시 로컬에서 움직인다 (예측) — 왕복을 기다리면
// 키를 눌러도 100ms 뒤에 반응한다.

const WORLD = 51200, SECTOR = 3200, SPEED = 600;   // FieldGeometry.h 와 같은 값
const VIEW_RADIUS = 2800;
const PX_PER_UU = 0.13;                            // 화면 1px = 7.7uu

const canvas = $('canvas');
const ctx = canvas.getContext('2d');

let ws = null;
let myId = null;
const me = { x: WORLD / 2, y: WORLD / 2, facing: 0 };
const entities = new Map();   // id -> {x, y, facing, rx, ry, nickname, partnerSpecies}
const keys = new Set();

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}
addEventListener('resize', resize);

function append(cls, html) {
  const line = document.createElement('div');
  line.className = cls;
  line.innerHTML = html;
  $('log').appendChild(line);
  $('log').scrollTop = $('log').scrollHeight;
}

// --- 입력 ---

addEventListener('keydown', e => {
  if (document.activeElement === $('text')) return;
  keys.add(e.key.toLowerCase());
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

function inputVector() {
  let dx = 0, dy = 0;
  if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
  if (keys.has('d') || keys.has('arrowright')) dx += 1;
  if (keys.has('w') || keys.has('arrowup')) dy -= 1;
  if (keys.has('s') || keys.has('arrowdown')) dy += 1;
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }   // 대각선이 더 빠르면 안 된다
  return [dx, dy];
}

// --- 렌더 ---

let lastFrame = performance.now();

// 종속 포켓몬은 서버가 시뮬레이션하지 않는다. 주인 뒤를 따라다니는 것뿐이라
// 클라가 그린다. 여기가 그 꼬리 좌표를 들고 있는 곳이다.
function drawActor(sx, sy, facing, nickname, partnerSpecies, color, state) {
  const dpr = devicePixelRatio;
  const trailX = sx - Math.cos(facing) * 34 * dpr;
  const trailY = sy - Math.sin(facing) * 34 * dpr;
  state.px = state.px === undefined ? trailX : state.px + (trailX - state.px) * 0.12;
  state.py = state.py === undefined ? trailY : state.py + (trailY - state.py) * 0.12;

  if (partnerSpecies) {
    ctx.fillStyle = '#5fc98a';
    ctx.beginPath();
    ctx.arc(state.px, state.py, 7 * dpr, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#5fc98abb';
    ctx.font = (10 * dpr) + 'px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(speciesName(partnerSpecies), state.px, state.py - 12 * dpr);
  }

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(sx, sy, 13 * dpr, 0, Math.PI * 2);
  ctx.fill();

  // 바라보는 방향
  ctx.strokeStyle = '#0a0d13';
  ctx.lineWidth = 3 * dpr;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + Math.cos(facing) * 15 * dpr, sy + Math.sin(facing) * 15 * dpr);
  ctx.stroke();

  if (nickname) {
    ctx.fillStyle = '#e8eaf0';
    ctx.font = (12 * dpr) + 'px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(nickname, sx, sy - 22 * dpr);
  }
}

function draw(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  requestAnimationFrame(draw);
  if (!$('field').classList.contains('active')) return;

  // 로컬 예측. 서버도 같은 속도로 상한을 건다.
  const [dx, dy] = inputVector();
  if (dx || dy) {
    me.x = Math.max(0, Math.min(WORLD - 1, me.x + dx * SPEED * dt));
    me.y = Math.max(0, Math.min(WORLD - 1, me.y + dy * SPEED * dt));
    me.facing = Math.atan2(dy, dx);
  }

  // 남들은 목표 좌표로 부드럽게 따라간다.
  for (const e of entities.values()) {
    e.rx += (e.x - e.rx) * Math.min(1, dt * 12);
    e.ry += (e.y - e.ry) * Math.min(1, dt * 12);
  }

  const w = canvas.width, h = canvas.height;
  const s = PX_PER_UU * devicePixelRatio;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);

  // 월드 좌표 -> 화면. 카메라가 나를 따라간다.
  const sx = wx => (wx - me.x) * s + w / 2;
  const sy = wy => (wy - me.y) * s + h / 2;

  // 섹터 격자. 어디쯤인지 감이 오게 얇게만 긋는다.
  ctx.strokeStyle = '#1a2030';
  ctx.lineWidth = 1;
  for (let gx = Math.floor((me.x - w / 2 / s) / SECTOR) * SECTOR;
       gx < me.x + w / 2 / s + SECTOR; gx += SECTOR) {
    ctx.beginPath(); ctx.moveTo(sx(gx), 0); ctx.lineTo(sx(gx), h); ctx.stroke();
  }
  for (let gy = Math.floor((me.y - h / 2 / s) / SECTOR) * SECTOR;
       gy < me.y + h / 2 / s + SECTOR; gy += SECTOR) {
    ctx.beginPath(); ctx.moveTo(0, sy(gy)); ctx.lineTo(w, sy(gy)); ctx.stroke();
  }

  // 서버의 kEnterRadius. 뷰 리스트가 어디까지인지 눈으로 보인다.
  ctx.strokeStyle = '#2a3040';
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, VIEW_RADIUS * s, 0, Math.PI * 2);
  ctx.stroke();

  for (const e of entities.values()) {
    drawActor(sx(e.rx), sy(e.ry), e.facing, e.nickname, e.partnerSpecies, '#4a90d9', e);
  }
  drawActor(w / 2, h / 2, me.facing, session ? session.nickname : '',
            session && session.partner ? session.partner.speciesId : 0, '#f2c14e', me);

  $('hudPos').textContent = '(' + me.x.toFixed(0) + ', ' + me.y.toFixed(0) + ')';
  $('hudNear').textContent = '섹터 ' + Math.floor(me.x / SECTOR) + ',' +
                             Math.floor(me.y / SECTOR) + ' · 주변 ' + entities.size + '명';
}
requestAnimationFrame(draw);

// --- WebSocket ---
//
// 20Hz 이동을 HTTP 요청 하나씩 보내는 건 말이 안 된다. 필드와 채팅 양쪽을
// 이 소켓 하나로 주고받는다.

function openSocket() {
  ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { ws = null; };
}

function handle(ev) {
  switch (ev.kind) {
    case 'enter':
      myId = ev.entityId;
      me.x = ev.x; me.y = ev.y; me.facing = ev.facing;
      append('system', '필드 입장 (' + ev.x.toFixed(0) + ', ' + ev.y.toFixed(0) + ')');
      break;

    case 'snapshot':
      for (const e of ev.spawned) {
        if (e.id === myId) continue;
        entities.set(e.id, Object.assign({}, e, { rx: e.x, ry: e.y }));
      }
      for (const e of ev.moved) {
        const known = entities.get(e.id);
        if (known) { known.x = e.x; known.y = e.y; known.facing = e.facing; }
      }
      for (const id of ev.despawned) entities.delete(id);
      break;

    case 'fieldNotice': append('closed', esc(ev.text)); break;
    case 'notice':      append('notice', '* ' + esc(ev.text)); break;
    case 'error':       append('closed', esc(ev.text)); break;
    case 'chat':
      append(session && ev.nickname === session.nickname ? 'me' : '',
             '<strong>' + esc(ev.nickname) + '</strong> ' + esc(ev.text));
      break;
    case 'closed':
      append('closed', '연결 종료: ' + esc(ev.text));
      session = null;
      say($('loginMsg'), '연결이 종료되었습니다', false);
      show('login');
      break;
  }
}

// 20Hz 로 위치를 보낸다. 서버가 속도 상한으로 검증한다.
setInterval(() => {
  if (ws && ws.readyState === 1 && $('field').classList.contains('active')) {
    ws.send(JSON.stringify({ t: 'move', x: me.x, y: me.y, f: me.facing }));
  }
}, 50);

$('sayForm').onsubmit = e => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text || !ws) return;
  $('text').value = '';
  ws.send(JSON.stringify({ t: 'say', text }));
  $('text').blur();
};

// 캐릭터를 바꾸려면 로그인 연결이 다시 필요하다. 선택과 함께 닫혔으므로
// 비밀번호를 다시 받아야 한다.
$('leaveBtn').onclick = async () => {
  await post('/api/logout');
  session = null; entities.clear();
  say($('loginMsg'), '캐릭터를 바꾸려면 다시 로그인하세요', true);
  show('login');
};

$('logoutBtn').onclick = async () => {
  await post('/api/logout');
  username = ''; characters = []; session = null; entities.clear();
  say($('loginMsg'), '로그아웃했습니다', true);
  show('login');
};

// ------------------------------------------------------------- 회원 정보

$('infoBtn').onclick = () => {
  if (!session) return;
  const partner = session.partner;
  $('infoUser').textContent = username;
  $('infoNick').textContent = session.nickname;
  $('infoPartner').textContent = partner
    ? (partner.nickname || speciesName(partner.speciesId)) + ' Lv.' + partner.level
    : '없음';
  $('infoChat').textContent = session.services
    ? Object.keys(session.services).map(k => k + ' ' + session.services[k]).join(' / ')
    : '';
  $('infoTicket').textContent = 'Ed25519 서명, 서비스별 발급';
  $('infoSince').textContent = session.since;
  $('info').classList.add('open');
};
$('infoClose').onclick = () => $('info').classList.remove('open');
$('info').onclick = e => { if (e.target === $('info')) $('info').classList.remove('open'); };

resize();
openSocket();

renderStarters();
</script>
</body>
</html>
